name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja glfw glslang molten-vk vulkan-loader vulkan-headers

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libglfw3-dev libvulkan-dev vulkan-tools glslang-tools libssl-dev lldb-18 \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = Get-ChildItem C:\VulkanSDK -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # LLVM 20's Windows LLDB binaries require python310.dll and the Python
      # standard library; the preinstalled LLVM package does not bundle them.
      - name: Install LLDB Python runtime (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Install debugger (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --version=20.1.8 --allow-downgrade --no-progress -y
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Unix)
        id: build_unix
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Build (Windows)
        id: build_windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Test real debugger (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          LUCID_TEST_LLDB: '1'
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            mkdir -p "$RUNNER_TEMP/lucid-debug-bin"
            ln -s "$(command -v lldb-dap-18)" "$RUNNER_TEMP/lucid-debug-bin/lldb-dap"
            export PATH="$RUNNER_TEMP/lucid-debug-bin:$PATH"
          fi
          ctest --test-dir build -R '^debug.lldb_optional$' --output-on-failure

      - name: Test real debugger (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LUCID_TEST_LLDB: '1'
        run: ctest --test-dir build -C Release -R '^debug.lldb_optional$' --output-on-failure

      - name: Test (Unix)
        if: ${{ !cancelled() && runner.os != 'Windows' && steps.build_unix.outcome == 'success' }}
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build_windows.outcome == 'success' }}
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test module packaging (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 tests/packaging/module_publish_test.py
          python3 tests/packaging/module_public_test.py
          python3 tests/packaging/module_registry_compatibility_test.py
          python3 tools/modules/publish.py > /dev/null

      - name: Test module packaging (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tests/packaging/module_publish_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/packaging/module_public_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/packaging/module_registry_compatibility_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/modules/publish.py | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
