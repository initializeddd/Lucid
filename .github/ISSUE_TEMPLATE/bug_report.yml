name: Bug report
description: Report a crash, rendering problem or unexpected behaviour.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the problem.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Lucid
        2. Press ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Lucid version or commit
      placeholder: "v0.2.1-beta.2 or a commit SHA"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (X11)
        - Linux (Wayland)
        - Windows 11
        - Windows 10
        - FreeBSD
        - OpenBSD
        - Other
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: The Vulkan device Lucid selected, if known.
      placeholder: "Apple M2 / MoltenVK 1.2.x"

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or recordings
      description: Paste relevant output or attach a capture. Remove credentials, private code and personal information first.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I checked whether the problem occurs in the latest available release or `main`, when possible.
          required: false
