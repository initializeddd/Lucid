name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to use for preflight packages
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja glfw glslang molten-vk vulkan-loader vulkan-headers

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libglfw3-dev libvulkan-dev vulkan-tools glslang-tools libssl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = Get-ChildItem C:\VulkanSDK -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Install DMG builder (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install 'dmgbuild==1.6.5'

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          packaging/macos/bundle-libraries.sh build/bin/Lucid.app
          ditto -c -k --keepParent \
            build/bin/Lucid.app "dist/Lucid-${RELEASE_TAG}-macOS.zip"
          DMGBUILD="$RUNNER_TEMP/dmgbuild/bin/dmgbuild" packaging/macos/create-dmg.sh build/bin/Lucid.app "dist/Lucid-${RELEASE_TAG}-macOS.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          name="Lucid-${RELEASE_TAG}-Linux"
          stage="${RUNNER_TEMP}/${name}"
          mkdir -p "${stage}/lib" dist
          cp build/bin/lucid "${stage}/"
          cp build/bin/lucid-shader-preview-helper "${stage}/"
          cp -r build/bin/assets "${stage}/assets"
          cp LICENSE "${stage}/LICENSE"
          mkdir -p "${stage}/licenses"
          cp third_party/sha2/LICENSE "${stage}/licenses/sha2-BSD-3-Clause.txt"
          cp packaging/linux/dev.lucid.editor.desktop packaging/linux/dev.lucid.editor.png "${stage}/"
          release_name="Lucid"
          if [[ "$RELEASE_TAG" == *-* ]]; then release_name="Lucid (Beta)"; fi
          printf '%s\n' \
            "$release_name" \
            "" \
            "Run: ./lucid" \
            "" \
            "All required shared libraries are bundled in lib/." \
            > "${stage}/README.txt"
          while read -r library; do
            case "$(basename "${library}")" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libutil.so.*|libgcc_s.so.*|libstdc++.so.*|libresolv.so.*|ld-linux*) continue ;;
            esac
            cp -L "${library}" "${stage}/lib/"
          done < <(ldd build/bin/lucid | awk '/=> \// {print $3}')
          if ldd "${stage}/lucid" | grep -q "not found"; then
            ldd "${stage}/lucid"
            exit 1
          fi
          tar -czf "dist/${name}.tar.gz" -C "${stage}" .
          sed "s/@LUCID_RELEASE_TAG@/${RELEASE_TAG}/g" packaging/linux/install.sh > dist/install.sh

      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter Lucid.exe | Select-Object -First 1
          if (-not $exe) { throw "Lucid.exe not found" }
          $stage = Join-Path $env:RUNNER_TEMP 'lucid-msi-payload'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $exe.FullName $stage
          Copy-Item "$($exe.DirectoryName)\lucid-shader-preview-helper.exe" $stage
          Copy-Item "$($exe.DirectoryName)\assets" $stage -Recurse
          New-Item -ItemType Directory -Force "$stage\licenses" | Out-Null
          Copy-Item third_party/sha2/LICENSE "$stage\licenses\sha2-BSD-3-Clause.txt"
          if (Test-Path "$($exe.DirectoryName)\WebView2Loader.dll") {
            Copy-Item "$($exe.DirectoryName)\WebView2Loader.dll" $stage
            Copy-Item "$($exe.DirectoryName)\WebView2.LICENSE.txt" $stage
          }
          Compress-Archive -Path "$stage\*" `
            -DestinationPath "dist\Lucid-$env:RELEASE_TAG-Windows.zip"
          $wix = (Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin\heat.exe" | Select-Object -First 1).DirectoryName
          if (-not $wix) { throw "WiX 3 was not found" }
          & "$wix\heat.exe" dir $stage -cg Payload -dr INSTALLFOLDER -srd -sreg -sfrag -ag -var var.SourceDir -out "$env:RUNNER_TEMP\Payload.wxs"
          if ($LASTEXITCODE -ne 0) { throw "WiX harvest failed" }
          & "$wix\candle.exe" -arch x64 "-dSourceDir=$stage" packaging/windows/Lucid.wxs "$env:RUNNER_TEMP\Payload.wxs" -out "$env:RUNNER_TEMP\"
          if ($LASTEXITCODE -ne 0) { throw "WiX compilation failed" }
          & "$wix\light.exe" "$env:RUNNER_TEMP\Lucid.wixobj" "$env:RUNNER_TEMP\Payload.wixobj" -out "dist\Lucid-$env:RELEASE_TAG-Windows.msi"
          if ($LASTEXITCODE -ne 0) { throw "WiX linking failed" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  package-freebsd:
    name: Package FreeBSD
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          envs: 'RELEASE_TAG'
          prepare: |
            pkg install -y cmake ninja git glfw vulkan-headers vulkan-loader glslang openssl
          run: |
            cmake -S . -B build-bsd -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/local
            cmake --build build-bsd --parallel 2
            ctest --test-dir build-bsd --output-on-failure
            sh packaging/bsd/package.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: package-FreeBSD
          path: dist/*
          if-no-files-found: error

  package-openbsd:
    name: Package OpenBSD
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/openbsd-vm@v1
        with:
          envs: 'RELEASE_TAG'
          prepare: |
            pkg_add cmake ninja git glfw vulkan-headers vulkan-loader glslang
          run: |
            cmake -S . -B build-bsd -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/local
            cmake --build build-bsd --parallel 2
            ctest --test-dir build-bsd --output-on-failure
            sh packaging/bsd/package.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: package-OpenBSD
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [package, package-freebsd, package-openbsd]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum -- * > "$RUNNER_TEMP/lucid-SHA256SUMS.txt"
          mv "$RUNNER_TEMP/lucid-SHA256SUMS.txt" SHA256SUMS.txt

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ contains(github.ref_name, '-') && format('Lucid (Beta) {0}', github.ref_name) || format('Lucid {0}', github.ref_name) }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
