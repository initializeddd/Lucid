name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja glfw glslang molten-vk vulkan-loader vulkan-headers

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libglfw3-dev libvulkan-dev vulkan-tools glslang-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = Get-ChildItem C:\VulkanSDK -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            build/bin/Lucid.app "dist/Lucid-${GITHUB_REF_NAME}-macOS.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          name="Lucid-${GITHUB_REF_NAME}-Linux"
          stage="dist/${name}"
          mkdir -p "${stage}/lib" dist
          cp build/bin/lucid "${stage}/"
          cp -r build/bin/assets "${stage}/assets"
          cp LICENSE "${stage}/LICENSE"
          printf '%s\n' \
            "Lucid (Beta)" \
            "" \
            "Run: ./lucid" \
            "" \
            "All required shared libraries are bundled in lib/." \
            > "${stage}/README.txt"
          while read -r library; do
            case "$(basename "${library}")" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libutil.so.*|libgcc_s.so.*|libstdc++.so.*|libresolv.so.*|ld-linux*) continue ;;
            esac
            cp -L "${library}" "${stage}/lib/"
          done < <(ldd build/bin/lucid | awk '/=> \// {print $3}')
          if ldd "${stage}/lucid" | grep -q "not found"; then
            ldd "${stage}/lucid"
            exit 1
          fi
          tar -czf "dist/${name}.tar.gz" -C "${stage}" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter Lucid.exe |
            Select-Object -First 1
          Compress-Archive -Path "$($exe.DirectoryName)\Lucid.exe", `
            "$($exe.DirectoryName)\assets" `
            -DestinationPath "dist\Lucid-$env:GITHUB_REF_NAME-Windows.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Lucid (Beta) ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
