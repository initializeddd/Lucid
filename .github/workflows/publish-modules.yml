name: Publish Lucid modules

on:
  workflow_dispatch:
  push:
    branches:
      - lucid-module-publish

permissions:
  contents: read
  packages: write

# Publishing writes module tags before updating the shared catalog tag. Keep
# runs serialized so two revisions cannot interleave their artifact updates.
concurrency:
  group: lucid-module-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.2.3
      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username '${{ github.actor }}' --password-stdin
      - name: Diagnose package API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api /user/packages/container/lucid-module-accessibility-test-runner

